# 本番用 overlay（EC2）。base(docker-compose.yml) を include するので、これ単体で起動できる:
#   API_DOMAIN=api.example.com docker compose -f docker-compose.prod.yml up -d --build
#   （env は別途設定）
#
# 構成: フロントは Vercel、バックエンドは EC2。
#   ブラウザ(Vercel/https) ──HTTPS──> EC2 nginx(443, Let's Encrypt) ──> bff(/graphql)
#                                         └ DB/Redis は EC2 上のコンテナ（host 非公開）
#
# frontend コンテナはここには無い（Vercel が担当）。
#
# 起動前に必須の環境変数:
#   API_DOMAIN          バックエンドのドメイン（例 api.geniesta.example.com）。TLS 証明書/ルーティングに使用
#   ALLOWED_ORIGIN      Vercel の公開オリジン（例 https://geniesta.vercel.app）。CORS 許可
#   POSTGRES_PASSWORD   強いパスワード
#   GITHUB_TOKEN        GitHub API トークン
#
# 事前準備（EC2）:
#   1) DNS: API_DOMAIN の A レコードを EC2 のパブリック IP に向ける
#   2) Security Group: 80/tcp と 443/tcp を解放（DB/Redis/bff は解放しない）
#   3) 証明書の初回発行（nginx 起動前に standalone で取得）:
#      docker run --rm -p 80:80 -v geniesta_certbot-conf:/etc/letsencrypt \
#        certbot/certbot certonly --standalone -d "$API_DOMAIN" \
#        --email you@example.com --agree-tos --no-eff-email
#   4) 以後は up すれば nginx が 443 で起動、certbot サービスが自動更新する。

# base を取り込む（-f を1つにできる）
include:
  - docker-compose.yml

# project 名（include 経由でも固定するため明示）
name: geniesta

services:

  postgres:
    image: postgres:prod
    restart: always

  redis:
    image: redis:prod
    restart: always

  bff:
    image: bff:prod
    restart: always
    # ALLOWED_ORIGIN は base で ${ALLOWED_ORIGIN} を参照済み。Vercel ドメインを env で注入する。

  nginx:
    image: nginx:prod
    restart: always
    environment:
      # default.conf.template 内の ${API_DOMAIN} を nginx 起動時に envsubst で展開
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN を設定してください}
    volumes:
      # 本番ルーティング（bff ゲートウェイ + TLS）。テンプレートは起動時に conf へ展開される
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      # Let's Encrypt 証明書 / ACME チャレンジ用 webroot（certbot と共有）
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    ports:
      - "80:80"     # ACME チャレンジ + HTTPS へのリダイレクト
      - "443:443"   # 本番 API（TLS 終端）

  # Let's Encrypt 自動更新（12時間ごとに renew を試行）
  certbot:
    image: certbot/certbot
    restart: always
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >-
      sh -c 'trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot;
      sleep 12h & wait $${!}; done'

volumes:
  certbot-conf:
  certbot-www:
