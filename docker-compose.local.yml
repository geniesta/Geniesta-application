# ローカル開発用 overlay。base(docker-compose.yml) を include するので、これ単体で起動できる:
#   docker compose -f docker-compose.local.yml up -d --build
#
# 役割（base との差分のみ）:
#   - host ポート公開（DB/Redis/BFF/nginx/frontend）
#   - frontend を dev(HMR) 化（ソースマウント + Dockerfile.dev）
#
# アクセス:
#   http://localhost:3000   frontend(dev/HMR)        ← 普段の開発
#   http://localhost:8000   nginx(本番相当ルーティング, /graphql 等)
#   http://localhost:8080   BFF GraphQL Playground 直
#   localhost:5432 / 6379   postgres / redis（DBクライアント用）

# base を取り込む（-f を1つにできる）
include:
  - docker-compose.yml

# project 名（include 経由でも固定するため明示）
name: geniesta

services:

  postgres:
    image: postgres:dev
    ports:
      - "5432:5432"   # ローカル DB クライアント用

  redis:
    image: redis:dev
    ports:
      - "6379:6379"   # ローカル Redis クライアント用

  bff:
    image: bff:dev
    ports:
      - "8080:8080"   # GraphQL Playground 直アクセス用

  # frontend は本番では Vercel。ローカル全スタック確認用にここで dev コンテナを定義。
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile.dev
    image: frontend:dev
    environment:
      NODE_ENV: development
      BFF_URL:  http://bff:8080
    volumes:
      # ソースコードをライブマウント（ホットリロード対応）
      - ./frontend:/app
      # node_modules はコンテナ内の名前付きボリューム（ホスト側と分離）
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      bff:
        condition: service_healthy
    # dev モードでは healthcheck 不要
    healthcheck:
      disable: true

  nginx:
    image: nginx:dev
    depends_on:
      - frontend
    ports:
      - "8000:80"   # 3000 は dev frontend が使うため nginx は 8000

volumes:
  frontend_node_modules:
