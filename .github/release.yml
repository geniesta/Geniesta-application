# リリースノート自動生成の分類（147）。GitHub の --generate-notes / リリース自動生成が参照する。
# PR ラベルでカテゴリ分けする。未ラベルは「その他」に入る。
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: 機能 / Features
      labels:
        - feature
        - enhancement
    - title: 修正 / Fixes
      labels:
        - bug
        - fix
    - title: 信頼ファクト / Trust facts
      labels:
        - trust-facts
        - vulnerability
        - usage
    - title: 信頼性・可観測性 / Reliability & Observability
      labels:
        - reliability
        - observability
        - a11y
    - title: ドキュメント / Docs
      labels:
        - documentation
    - title: 依存更新 / Dependencies
      labels:
        - dependencies
    - title: その他 / Other
      labels:
        - "*"
