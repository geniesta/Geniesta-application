name: docker-quality

# Dockerfile の Lint（Hadolint）と、ビルド済みイメージの脆弱性スキャン（Trivy）。
on:
  pull_request:
    paths:
      - "docker/**"
      - "backend/**"
      - "frontend/**"
      - "docker-compose*.yml"
      - ".github/workflows/docker-quality.yml"
  push:
    branches: [main]

jobs:
  # ── Hadolint: 全 Dockerfile を静的解析 ──────────────────────────────────────────
  hadolint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - docker/backend/Dockerfile
          - docker/frontend/Dockerfile
          - docker/frontend/Dockerfile.dev
          - docker/db/Dockerfile
          - docker/redis/Dockerfile
          - docker/nginx/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - name: Hadolint ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  # ── Trivy: 自前イメージ（bff / frontend）を脆弱性スキャン ──────────────────────
  trivy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bff
            context: backend
            dockerfile: docker/backend/Dockerfile
          - image: frontend
            context: frontend
            dockerfile: docker/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - name: Build ${{ matrix.image }}
        run: docker build -t ${{ matrix.image }}:scan -f ${{ matrix.dockerfile }} ${{ matrix.context }}
      - name: Trivy scan ${{ matrix.image }}（HIGH/CRITICAL で失敗）
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}:scan
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
