name: docker-quality

# Dockerfile の Lint（Hadolint）と、ビルド済みイメージの脆弱性スキャン（Trivy）。
# Docker は「任意」のセルフホスト用（既定デプロイは Vercel）なので、Dockerfile が
# 変わった時だけ回す（全 frontend PR でフルイメージビルドを走らせない）。
on:
  pull_request:
    paths:
      - "frontend/Dockerfile"
      - "frontend/.dockerignore"
      - ".github/workflows/docker-quality.yml"
  push:
    branches: [main]
    paths:
      - "frontend/Dockerfile"
      - "frontend/.dockerignore"
      - ".github/workflows/docker-quality.yml"

concurrency:
  group: docker-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Hadolint: Dockerfile を静的解析 ─────────────────────────────────────────────
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint frontend/Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: frontend/Dockerfile

  # ── Trivy: 自前イメージ（frontend）を脆弱性スキャン ──────────────────────────────
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image（build context = frontend/）
        run: docker build -t geniesta:scan -f frontend/Dockerfile frontend
      - name: Trivy scan（HIGH/CRITICAL で失敗）
        # @master は可変参照で避ける。タグ固定し、更新は dependabot(github-actions) に任せる。
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: geniesta:scan
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
