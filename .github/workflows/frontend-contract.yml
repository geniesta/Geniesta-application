name: frontend-contract

# 契約（contract）テスト：実 GitHub / OSV API に当て、コードが依存するレスポンスの「形」が
# 今も存続しているかを検証する。MSW モックが隠す外部 API のスキーマ変更（contract drift）を捕捉する。
# レート制限・ネットワーク依存のため PR ゲート（frontend-ci）には載せず、1日1回（nightly）に隔離する。
on:
  schedule:
    # 毎日 UTC 18:00（JST 03:00）。
    - cron: "0 18 * * *"
  workflow_dispatch: {} # 手動実行も可

concurrency:
  group: frontend-contract
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Contract tests (real GitHub / OSV)
        # GitHub Actions 標準トークンでレート枠を確保（OSV は鍵不要）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run test:contract
