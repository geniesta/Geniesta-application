name: frontend-ci

# フロントエンドの品質ゲート：型 → Lint → ユニット/コンポーネント/a11y → ビルド → E2E。
# fail-fast（前段が落ちたら後段を実行しない）。E2E は外部 API に触れるため別ジョブで隔離。
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]

# 同一 PR/ブランチの古い実行はキャンセル（無駄な並走を防ぐ）。
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  # ── 型 → Lint → テスト（unit/component/a11y）→ ビルド ───────────────────────────
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test (unit + component + a11y) ＋ カバレッジ閾値ゲート
        run: bun run test:coverage
      - name: Build
        run: bun run build

  # ── E2E（Playwright）。受け入れシナリオ（検索→一覧→詳細の独立ページ AC-7）を検証 ──
  e2e:
    runs-on: ubuntu-latest
    needs: quality
    env:
      # 認証ありで GitHub API のレート制限を緩和（未設定でも縮退して動く）。
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: E2E (playwright.config が build→start を起動)
        run: bun run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
